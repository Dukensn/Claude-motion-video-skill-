<!doctype html>
<!-- Stickman template. Every data-duration is synced to FILM.DURATION by scripts/sync-duration.sh (audio.sh and render.sh run it).
     For a vertical Short: set window.FRAME = { W: 1080, H: 1920 } below and run scripts/sync-duration.sh (it also syncs the size). -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>__TITLE__</title>
    <script>window.FRAME = { W: 1920, H: 1080 };</script>
    <script src="assets/js/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Inter"; font-weight: 100 900; src: url("assets/fonts/Inter.ttf"); }
      @font-face { font-family: "Caveat"; font-weight: 400 700; src: url("assets/fonts/Caveat.ttf"); }
      @font-face { font-family: "Lilita One"; src: url("assets/fonts/LilitaOne.ttf"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; }
      #film { position: absolute; inset: 0; width: 1920px; height: 1080px; }
      .font-warm { position: absolute; left: -9999px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="40" data-width="1920" data-height="1080">
      <canvas id="film" class="clip" width="1920" height="1080" data-start="0" data-duration="40" data-track-index="0" data-track-kind="graphics" data-layout-ignore></canvas>
      <audio id="score" class="clip" src="assets/audio/mix.wav" data-start="0" data-duration="40" data-track-index="1" data-volume="1"></audio>
      <span class="font-warm" data-layout-ignore><span style="font-family: Inter">Aa</span><span style="font-family: Caveat">Aa</span><span style="font-family: 'Lilita One'">Aa</span></span>
    </div>
    <script src="assets/js/core.js"></script>
    <script src="assets/js/stick.js"></script>
    <script src="assets/js/world.js"></script>
    <script src="assets/js/timeline.js"></script>
    <script src="assets/js/text.js"></script>
    <script src="assets/js/vfx.js"></script>
    <script src="assets/js/style.js"></script>
    <script src="assets/js/film.js"></script>
    <script>
      (function () {
        const canvas = document.getElementById("film");
        const ctx = canvas.getContext("2d");
        let last = 0;
        function renderAt(t) { last = t; FILM.renderAt(ctx, t); }
        window.__renderAt = renderAt;
        const fontsReady = Promise.all([
          document.fonts.load('900 40px "Inter"'),
          document.fonts.load('700 40px "Inter"'),
          document.fonts.load('700 40px "Caveat"'),
          document.fonts.load('400 40px "Lilita One"'),
        ]).then(() => renderAt(last));
        window.__hf = window.__hf || {};
        window.__hf.buildReady = window.__hf.buildReady || {};
        window.__hf.buildReady["fonts"] = fontsReady;
        window.addEventListener("hf-seek", (e) => {
          renderAt(e.detail.time);
          if (e.detail.waitUntil) e.detail.waitUntil(fontsReady);
        });
        renderAt(0);
        const tl = gsap.timeline({ paused: true });
        tl.set({}, {}, FILM.DURATION);
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
